<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bashir PS4/PS5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Bashir / PS4 / 9.00 / 13.52</h1>
    <hr>
    <br>
    
    <!-- تم نقل الوسم للأعلى وتحديده بشكل صحيح -->
    <h1 id="msgs" style="font-size: 34px; margin-top: 77px; margin-bottom: 455px;">
        جارٍ تحميل GoldHEN... يُرجى الانتظار
    </h1>

    <script>
        // ضمان تنفيذ السكريبت بعد اكتمال تحميل عناصر الصفحة بالكامل (DOM)
        document.addEventListener("DOMContentLoaded", function () {
            
            var msgs = document.getElementById("msgs");

            // دالة مساعدة لتحديث الرسائل على الشاشة بأمان
            function showMessage(text, isError) {
                if (msgs) {
                    msgs.innerHTML = isError ? '<span style="color: red;">' + text + '</span>' : text;
                }
            }

            // دالة معالجة خطأ التحميل
            function onScriptError() {
                showMessage("امسح بيانات المتصفح وأعد تثبيت التخزين المؤقت ...", true);
            }

            // دالة مساعدة لتحميل ملفات الـ JavaScript لتجنب تكرار الكود
            function loadScript(src, isModule, onLoadCallback) {
                var script = document.createElement("script");
                if (isModule) script.type = "module";
                script.src = src;
                script.onerror = onScriptError;
                if (onLoadCallback) script.onload = onLoadCallback;
                document.head.appendChild(script);
            }

            // 1. فحص بيئة الجهاز
            var uaFull = navigator.userAgent;
            var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
            var isPS4 = match !== null;

            if (!isPS4) {
                showMessage("مخصص فقط لأجهزة PS4", true);
                return;
            }

            var fwVersion = match[1];
            var fwNum = parseFloat(fwVersion);

            // 2. التحقق الآمن من حالة التخزين المؤقت (Cache Check)
            var isUncached = (window.applicationCache && window.applicationCache.status === 0);

            if (isUncached) {
                // حالة عدم وجود التخزين المؤقت
                if (fwNum >= 9.00 && fwNum <= 9.60) {
                    window.location.replace("cache900.html");
                } else if (fwNum >= 10.00 && fwNum <= 11.02) {
                    window.location.replace("cachecss.html");
                } else if (fwNum >= 11.50 && fwNum <= 13.00) {
                    window.location.replace("cacheslopkit.html");
                } else if (fwNum >= 13.02 && fwNum <= 13.52) {
                    window.location.replace("13xx/index.html");
                } else {
                    showMessage("نظام غير مدعوم: " + fwVersion, true);
                }
            } else {
                // حالة وجود الكاش أو تشغيل الجيلبريك المباشر
                if (fwNum >= 13.02 && fwNum <= 13.52) {
                    window.location.replace("13xx/index.html");
                } 
                else if (fwNum >= 9.00 && fwNum <= 9.60) {
                    loadScript("900/alert.js", true);
                } 
                else if (fwNum >= 10.00 && fwNum <= 11.02) {
                    loadScript("css/main.js", false, function () {
                        setTimeout(function () {
                            if (typeof doJb === "function") {
                                doJb();
                            }
                        }, 500);
                    });
                } 
                else if (fwNum >= 11.50 && fwNum <= 12.02) {
                    loadScript("slopkit/chain_lapse.js", true);
                } 
                else if (fwNum >= 12.03 && fwNum <= 13.00) {
                    // تم إغلاق الفجوة بين (12.03 - 12.49) المفقودة سابقاً
                    loadScript("slopkit/chain_poops.js", true);
                } 
                else {
                    // معالجة كافة الإصدارات غير المدعومة بشكل مؤكد بدلاً من تعليق الشاشة
                    showMessage("نظام غير مدعوم: " + fwVersion, true);
                }
            }
        });
    </script>
</body>
</html>
