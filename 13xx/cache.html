<!doctype html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bashir electronic</title>
<style>
html,body{
    width:100%;height:100%;margin:0;
    background:#020713 url("../background.jpg") center/cover no-repeat;
    color:#fff;font-family:Arial,Tahoma,sans-serif;
    overflow:hidden;text-align:center;
}
body:before{content:"";position:fixed;inset:0;background:rgba(0,4,18,.40);pointer-events:none}
#panel{
    position:absolute;z-index:1;left:5%;right:5%;top:50%;
    transform:translateY(-50%);
    padding:28px 18px;border:1px solid rgba(70,190,255,.35);
    border-radius:18px;background:rgba(2,14,38,.76);
    box-shadow:0 12px 35px rgba(0,0,0,.45);
}
#msgs{font-size:26px;line-height:1.7;text-shadow:0 1px 4px #000}
#bar{height:6px;margin:22px auto 0;max-width:620px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
#fill{height:100%;width:0;background:#18a7ff;border-radius:6px}
</style>
<script>
(function () {
    var msgs, fill, ac;
    var lastPct = -1;
    var finished = false;

    function ready() {
        msgs = document.getElementById("msgs");
        fill = document.getElementById("fill");
        ac = window.applicationCache;
        if (!msgs || !ac) return;

        msgs.textContent = "جارٍ تجهيز ذاكرة التخزين المؤقت...";
        ac.addEventListener("progress", onProgress, false);
        ac.addEventListener("cached", done, false);
        ac.addEventListener("updateready", done, false);
        ac.addEventListener("noupdate", done, false);
        ac.addEventListener("error", failed, false);
        ac.addEventListener("obsolete", failed, false);
    }

    function onProgress(e) {
        if (!e || !e.total || e.loaded == null) return;
        var pct = Math.max(0, Math.min(100, Math.round((e.loaded / e.total) * 100)));
        if (pct === lastPct) return;
        lastPct = pct;
        msgs.textContent = "جارٍ تثبيت ذاكرة التخزين المؤقت — " + pct + "%";
        fill.style.width = pct + "%";
    }

    function done() {
        if (finished) return;
        finished = true;
        fill.style.width = "100%";
        msgs.textContent = "تم تجهيز التخزين المؤقت بنجاح — جارٍ فتح الصفحة...";
        setTimeout(function () { location.replace("index.html"); }, 700);
    }

    function failed() {
        if (finished) return;
        finished = true;
        msgs.textContent = "تعذر تجهيز التخزين المؤقت — أعد فتح الصفحة مع بقاء الإنترنت متصلاً حتى يكتمل الحفظ.";
    }

    window.addEventListener("load", ready, false);
}());
</script>
</head>
<body>
<div id="panel">
    <div id="msgs">جارٍ تجهيز ذاكرة التخزين المؤقت...</div>
    <div id="bar"><div id="fill"></div></div>
</div>
</body>
</html>
