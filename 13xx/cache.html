<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<title>بشير لصيانة الأجهزة الإلكترونية والرقمية</title>
<style>
html, body { width:100%; height:100%; margin:0; }
body {
    background:#020713 url("../background.jpg") center center/cover no-repeat fixed;
    color:#fff; font-size:22px; text-align:center; margin:0; overflow:hidden;
    direction:rtl; font-family:Arial,Tahoma,sans-serif; text-shadow:0 1px 3px rgba(0,0,0,.85);
}
.cache-percent { display:inline-block; direction:ltr; unicode-bidi:isolate; white-space:nowrap; margin-right:6px; }
.info {
    position: absolute;
    top: 45%;
    left: 50%;
    font-size: 22px;
    font-family:Arial,Tahoma,sans-serif;
    color:#fff;
    transform: translate(-50%, -50%);
}
</style>
<script>
history.replaceState(null, null, 'index.html');
var histlength = history.length;
history.go(-histlength);

function DLProgress(e) {
    var pct = Math.round(e.loaded / e.total * 100);
    msgs.innerHTML = "جارٍ تثبيت ذاكرة التخزين المؤقت... <span class=\"cache-percent\">" + pct + "%</span>";
}

function DisplayCacheProgress() {
    setTimeout(function () {
        msgs.innerHTML = "تم تثبيت ذاكرة التخزين المؤقت بنجاح— جارٍ فتح الصفحة...";
    }, 2000);
    setTimeout(function () {
        location.reload();
    }, 3000);
}

window.applicationCache.addEventListener("progress",    DLProgress,           false);
window.applicationCache.oncached     = function (e) { DisplayCacheProgress(); };
window.applicationCache.onupdateready = function (e) { DisplayCacheProgress(); };
</script>
</head>
<body>
<div id="msgs" class="info"></div>
</body>
</html>
