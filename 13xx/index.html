<!-- Bashir / PS4 / 12.xx / 13.xx-->
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Bashir</title>
    <style>
        html, body { width:100%; min-height:100%; margin:0; }
        body {
            background:#020713 url("../background.jpg") center center/cover no-repeat fixed;
            color:#fff; font:18px/1.7 Arial,Tahoma,sans-serif; margin:0; padding:28px 18px;
            direction:rtl; text-align:center; text-shadow:0 1px 3px rgba(0,0,0,.85); overflow-x:hidden;
        }
        #console { font-family:Arial,Tahoma,sans-serif; white-space:pre-wrap; direction:rtl; }
        .ok   { color: #1a7a1a; }
        .bad  { color: #cc0000; }
        .warn { color: #aa6600; }
    </style>
    <script>
    if (window.applicationCache && window.applicationCache.status == 0) {
        window.location.replace("cache.html");
    }
    </script>
</head>
<body>
    بشير لصيانة الأجهزة الإلكترونية والرقمية — شارع طرابلس الداخلي — أجدابيا
      <br>
    <br>
    <pre id="console"></pre>
</body>
<script>
(function () {
    var con = document.getElementById("console");

    function print(msg, cls) {
        var span = document.createElement("span");
        if (cls) span.className = cls;
        span.textContent = msg + "\n";
        con.appendChild(span);
    }

    var params = new URLSearchParams(location.search);

    // Firmwares with measured kernel table — KEEP IN SYNC with ps4_offsets.js
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced    = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);

    print("البرامج الثابتة:  " + (key || "غير معروف"));
    print("معتمد:  " + (supported ? "نعم" : "لا"), supported ? "ok" : "bad");

    var target = "jb.html" + location.search;

    function go() {
        print("جارٍ الانتقال إلى صفحة التشغيل...", "warn");
        location.replace(target);
    }

    function waitForTap(msg, action) {
        print(msg, "warn");
        function fire() {
            window.removeEventListener("click",   fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click",   fire);
        window.addEventListener("keydown", fire);
    }

    if (!supported) {
        print("البرامج الثابتة غير مدعومة — اضغط  X للتشغيل على أي حال", "bad");
        waitForTap("", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        print("وضع عدم الاتصال — التشغيل من التخزين المؤقت", "ok");
        go();
    } else if (ac.status === ac.IDLE) {
        print("التخزين المؤقت جاهز", "ok");
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        print("تم تنزيل التحديث", "ok");
        waitForTap("التحديث جاهز — اضغط على الزر X لإعادة التحميل", function () { location.reload(); });
    } else {
        print("جارٍ فحص التخزين المؤقت...");
        ac.addEventListener("downloading",
            function () { print("جارٍ تجهيز الملفات للعمل دون اتصال..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                print("التجهيز " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            print("تم تجهيز التخزين المؤقت", "ok");
            waitForTap("التخزين المؤقت جاهز — اضغط X للتشغيل", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            print("تم تنزيل التحديث", "ok");
            waitForTap("التحديث جاهز — اضغط X لإعادة التحميل",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            print("جاهز للعمل دون اتصال", "ok");
            go();
        }, false);
        ac.addEventListener("error", function () {
            print("تعذر تجهيز التخزين المؤقت");
            waitForTap("فشل التخزين المؤقت — اضغط X للتشغيل على أية حال", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            print("التخزين المؤقت قديم");
            waitForTap("ذاكرة التخزين المؤقت قديمة — اضغط على X للتشغيل", go);
        }, false);
    }
})();
</script>
</html>
