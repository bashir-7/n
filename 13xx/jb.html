<!doctype html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bashir-ps4-ps5</title>
    <style>
      /* PS4-safe UI: no external fonts, no backdrop-filter, minimal animation */
      :root {
        --bg: #030b1d;
        --blue: #159cff;
        --blue2: #55c8ff;
        --ok: #35e6a0;
        --fail: #ff5d67;
        --text: #eef7ff;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background: var(--bg) url("../background.jpg") center center / cover no-repeat;
        color: var(--text);
        font-family: Arial, Tahoma, sans-serif;
        direction: rtl;
        text-align: center;
      }
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: rgba(0, 5, 22, .34);
        pointer-events: none;
        z-index: 0;
      }
      #main-container {
        position: relative;
        z-index: 1;
        width: 78vw;
        max-width: 410px;
        height: 78vw;
        max-height: 78vh;
        max-width: 78vh;
        border: 1px solid rgba(100,205,255,.30);
        border-radius: 28px;
        background: rgba(2, 14, 38, .70);
        box-shadow: 0 16px 38px rgba(0,0,0,.45), inset 0 0 28px rgba(30,155,255,.08);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      #brand {
        margin-bottom: 38px;
        font-weight: bold;
        font-size: 24px;
        color: #fff;
        letter-spacing: .02em;
        text-shadow: 0 0 14px rgba(55,190,255,.45);
      }
      #visual-indicator {
        position: relative;
        width: 82px;
        height: 82px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .pulse {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        border: 3px solid var(--blue);
        animation: subtle-pulse 2s infinite;
      }
      .core {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 18px rgba(21,156,255,.85);
      }
      #spin {
        position: absolute;
        width: 126%;
        height: 126%;
        border: 3px solid transparent;
        border-top-color: var(--blue2);
        border-radius: 50%;
        animation: real-spin .9s linear infinite;
      }
      body.done .pulse { border-color: var(--ok); animation: none; }
      body.done .core { background: var(--ok); box-shadow: 0 0 24px rgba(53,230,160,.8); }
      body.done #spin { display: none; }
      body.fail .pulse { border-color: var(--fail); animation: none; }
      body.fail .core { background: var(--fail); box-shadow: 0 0 24px rgba(255,93,103,.8); }
      body.fail #spin { display: none; }
      #msg {
        position: fixed;
        z-index: 2;
        top: 78%;
        left: 0;
        right: 0;
        padding: 0 16px;
        text-align: center;
        font-family: Arial, Tahoma, sans-serif;
        font-size: 18px;
        color: var(--fail);
        display: none;
        text-shadow: 0 1px 4px #000;
      }
      body.fail #msg { display: block; }
      #wrap { padding: 0; }
      body.log body::before, body.log #main-container, body.log #footer { display: none; }
      body.log {
        overflow: auto;
        display: block;
        padding: 20px;
        background: var(--bg);
        text-align: left;
        direction: ltr;
      }
      body.log #wrap { display: block; max-width: 900px; margin: 0 auto; }
      body.log #state {
        display: block;
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 12px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font: 12px/1.6 monospace;
        background: rgba(255,255,255,.04);
        border: 1px solid rgba(255,255,255,.10);
        border-radius: 12px;
        padding: 16px;
        max-height: calc(100vh - 100px);
        overflow-y: auto;
      }
      #state, #out { display: none; }
      .ok { color: var(--ok); }
      .bad { color: var(--fail); }
      .warn { color: #ffd166; }
      .safe { color: var(--ok); }
      .danger { color: var(--fail); }
      code { color: #9fdcff; }
      #footer {
        position: fixed;
        z-index: 2;
        bottom: 14px;
        left: 0;
        right: 0;
        font-size: 10px;
        color: rgba(255,255,255,.45);
        letter-spacing: .03em;
      }
      @keyframes real-spin { to { transform: rotate(360deg); } }
      @keyframes subtle-pulse {
        0%,100% { transform: scale(.95); opacity: .50; }
        50% { transform: scale(1.05); opacity: .85; }
      }
    </style>
  </head>
  <body>

    <div id="main-container">
        <div id="brand">Bashir-ps4-ps5</div>
        <div id="visual-indicator">
            <div id="spin"></div>
            <div class="pulse"></div>
            <div class="core"></div>
        </div>
    </div>

    <div id="msg">فشل التحميل للأسف! أعد تشغيل جهازك</div>
    
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>

    <div id="footer">بشير لصيانة الاجهزة الالكترونية والرقمية شارع طرابلس الداخلى اجدابيا</div>

    <script type="module">
      import "./jb.js?v=10";
    </script>

  </body>
</html>
