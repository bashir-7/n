<!doctype html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Bashir // PS4</title>
    <style>
      :root {
        --color-text:#fff; --color-initial:#5aa9ff; --color-ok:#27e58a; --color-fail:#ff5b68;
      }
      *{box-sizing:border-box;margin:0;padding:0}
      html,body{width:100%;min-height:100%;}
      body{min-height:100vh;display:flex;justify-content:center;align-items:center;direction:rtl;text-align:center;
        background:#020713 url("../background.jpg") center center/cover no-repeat fixed;
        color:var(--color-text);font-family:Arial,Tahoma,sans-serif;overflow:hidden;
        text-shadow:0 1px 3px rgba(0,0,0,.85)}
      body::before{content:"";position:fixed;inset:0;background:rgba(0,4,18,.18);z-index:-1;pointer-events:none}
      #main-container{position:relative;width:min(90%,400px);aspect-ratio:1/1;background:rgba(0,8,28,.58);
        border:1px solid rgba(0,174,255,.38);border-radius:28px;display:flex;flex-direction:column;
        justify-content:center;align-items:center;box-shadow:0 22px 55px rgba(0,0,0,.42),inset 0 0 0 1px rgba(255,255,255,.04)}
      body.done #main-container{border-color:rgba(39,229,138,.45);box-shadow:0 22px 55px rgba(0,0,0,.42),0 0 30px rgba(39,229,138,.12)}
      body.fail #main-container{border-color:rgba(255,91,104,.45)}
      #brand{font-weight:700;font-size:25px;line-height:1.5;margin-bottom:38px;color:#fff}
      #visual-indicator{position:relative;width:80px;height:80px;display:flex;justify-content:center;align-items:center}
      .pulse{position:absolute;width:100%;height:100%;border-radius:50%;border:3px solid var(--color-initial);animation:subtle-pulse 2s infinite}
      .core{width:40%;height:40%;background:var(--color-initial);border-radius:50%;box-shadow:0 0 15px var(--color-initial)}
      #spin{position:absolute;width:140%;height:140%;border:3px solid transparent;border-top-color:#fff;border-radius:50%;animation:real-spin .8s linear infinite;opacity:.3}
      body.done .pulse{border-color:var(--color-ok);animation:none} body.done .core{background:var(--color-ok);box-shadow:0 0 25px var(--color-ok)} body.done #spin{opacity:0}
      body.fail .pulse{border-color:var(--color-fail);animation:none} body.fail .core{background:var(--color-fail);box-shadow:0 0 25px var(--color-fail)} body.fail #spin{opacity:0}
      #msg{position:fixed;left:5%;right:5%;top:calc(50% + 112px);text-align:center;font-size:19px;line-height:1.7;color:var(--color-fail);display:none;direction:rtl;unicode-bidi:plaintext}
      body.fail #msg{display:block}
      #wrap{padding:0} #state,#out{display:none}
      body.log{overflow:auto;display:block;padding:20px;background:#020713 url("../background.jpg") center/cover fixed}
      body.log #main-container,body.log #footer{display:none}
      body.log #wrap{display:block;max-width:900px;margin:0 auto}
      body.log #state{display:block;font-size:20px;font-weight:700;margin-bottom:12px;color:#fff;direction:rtl;text-align:right}
      body.log #out{display:block;white-space:pre-wrap;font:14px/1.7 Arial,Tahoma,sans-serif;background:rgba(0,8,28,.72);border:1px solid rgba(0,174,255,.35);border-radius:12px;padding:16px;max-height:calc(100vh - 100px);overflow-y:auto;color:#fff;direction:ltr;text-align:left}
      .ok{color:var(--color-ok)} .bad{color:var(--color-fail)} .warn{color:#ffd166} .safe{color:var(--color-ok)} .danger{color:var(--color-fail)}
      #footer{position:fixed;bottom:18px;left:10px;right:10px;font-size:13px;line-height:1.6;color:rgba(255,255,255,.72);direction:rtl}
      @keyframes real-spin{to{transform:rotate(360deg)}}
      @keyframes subtle-pulse{0%,100%{transform:scale(.95);opacity:.5}50%{transform:scale(1.05);opacity:.8}}
      @media(max-width:600px){#main-container{width:88%;border-radius:24px}#brand{font-size:22px}#msg{font-size:17px}}
    </style>
  
<style id="bashir-jb-spinner-v2">
/* New visible loader for jb.html — visual-only, no JS changes */
.bashir-jb-spinner-v2{
  width:54px!important;height:54px!important;
  margin:12px auto!important;
  position:relative!important;
  display:block!important;
  border:0!important;
  border-radius:50%!important;
  background:transparent!important;
  box-shadow:none!important;
  animation:bjbSpin 1.15s linear infinite!important;
}
.bashir-jb-spinner-v2::before{
  content:""!important;
  position:absolute!important;
  inset:3px!important;
  border-radius:50%!important;
  border:3px solid rgba(255,255,255,.16)!important;
  border-top-color:#fff!important;
  border-right-color:rgba(120,190,255,.95)!important;
  box-shadow:0 0 14px rgba(100,180,255,.35)!important;
}
.bashir-jb-spinner-v2::after{
  content:""!important;
  position:absolute!important;
  width:9px!important;height:9px!important;
  left:22.5px!important;top:2px!important;
  border-radius:50%!important;
  background:#fff!important;
  box-shadow:0 0 10px rgba(120,200,255,.95)!important;
}
@keyframes bjbSpin{to{transform:rotate(360deg)}}

/* Cover the common legacy circular loader if it uses these classes. */
.spinner,.loader,.loading-spinner,.loading-circle,.loader-circle{
  border-color:rgba(255,255,255,.14)!important;
  border-top-color:transparent!important;
}
</style>
</head>
  <body>

    <div id="main-container">
        <div id="brand">Bashir / PS4/ 13.xx</div>
        <div id="visual-indicator">
            <div id="spin"></div>
            <div class="pulse"></div>
            <div class="core"></div>
        </div>
    </div>

    <div id="msg">فشل التحميل للأسف! أعد تشغيل جهازك</div>
    
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>

    <div id="footer">بشير لصيانة الاجهزة الالكترونية والرقمية شارع طرابلس الداخلى اجدابيا</div>

    <script type="module">
      import "./jb.js";
    </script>

  </body>
</html>
